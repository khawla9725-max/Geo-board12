<!doctype html>
<html lang="ar" dir="rtl">
<head>

<style>
html{height:100%;box-sizing:border-box;background:#1F3550;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Drafting desk: an ink-blue tool band over a paper board; instruments are translucent acrylic and steel. Single light look on purpose (paper is paper). */
:root{
  --paper:#FBFAF6; --ink:#1B2A4A; --band:#1F3550; --band-2:#2B4767; --on-band:#F3F1EA; --muted:#AFC0D4;
  --grid-minor:#E1E8F0; --grid-major:#BCCADB; --axis:#34507A; --rule:#C6D4E6; --margin:#E3A19C;
  --accent:#E8B04B; --red:#C8312B;
  --ui:'IBM Plex Sans Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column;touch-action:manipulation}
.bar{background:var(--band);color:var(--on-band);display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));position:relative;z-index:5}
.grp{display:flex;align-items:center;gap:3px;background:var(--band-2);border-radius:12px;padding:4px}
.lbl{font-size:12px;color:var(--muted);padding-inline:6px 2px;letter-spacing:.02em}
.btn{min-height:40px;min-width:42px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:var(--on-band);font:600 15px/1 var(--ui);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn[aria-pressed="true"]{background:var(--on-band);color:var(--band)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.warn{background:var(--red);color:#fff}
.sw{width:30px;height:30px;min-width:30px;padding:0;border-radius:50%;border:3px solid var(--band-2);box-shadow:0 0 0 2px transparent}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--on-band);background:inherit}
.dot{border-radius:50%;background:currentColor;display:block}
.board{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:var(--paper)}
.board canvas{position:absolute;left:0;top:0}
.tool{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;touch-action:none}
.tool svg{position:absolute;overflow:visible;direction:ltr;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(20,35,60,.22))}
.tool svg *{pointer-events:visiblePainted}
.hud{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);background:var(--band);color:var(--on-band);border-radius:10px;padding:8px 12px;font:500 14px/1.5 var(--ui);font-variant-numeric:tabular-nums;pointer-events:none;z-index:2000000;box-shadow:0 4px 14px rgba(20,35,60,.2)}
.hud b{color:var(--accent);font-weight:700}
.eraser-ring{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid var(--ink);background:rgba(255,255,255,.5);pointer-events:none;z-index:2000001}
/* instrument materials */
.ruler-b{fill:rgba(247,214,98,.45);stroke:rgba(150,110,20,.8);stroke-width:1.2}
.prot-b{fill:rgba(120,175,230,.30);stroke:rgba(40,95,160,.8);stroke-width:1.2}
.sq-b{fill:rgba(110,200,160,.32);stroke:rgba(30,120,85,.8);stroke-width:1.2;fill-rule:evenodd}
.tk{stroke:#2a2412;stroke-width:.9}.tk-b{stroke-width:1.5}
.tk-p{stroke:#163a63;stroke-width:.8}.tk-pb{stroke-width:1.4}
.num{font:600 13px var(--ui);fill:#2a2412;text-anchor:middle}
.num-p{font:600 11px var(--ui);fill:#163a63;text-anchor:middle;dominant-baseline:central}
.num-in{font:600 9.5px var(--ui);fill:#B23A2E;text-anchor:middle;dominant-baseline:central}
.unit{font:500 12px var(--ui);fill:#5a4a1e}
.ang{font:700 13px var(--ui);fill:#1d5a40;text-anchor:middle;dominant-baseline:central}
.base{stroke:#163a63;stroke-width:1.2}
.knob-c{fill:var(--band);stroke:#fff;stroke-width:2}
.knob-i{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hit{fill:transparent;stroke:none}
.hitl{stroke:transparent;stroke-width:28;stroke-linecap:round}
.arm{stroke:var(--red);stroke-width:2}
.arm-k{fill:var(--red);stroke:#fff;stroke-width:2}
.arm-t{font:700 14px var(--ui);fill:var(--red);text-anchor:middle;dominant-baseline:central}
.leg{stroke:#7C899B;stroke-width:9;stroke-linecap:round}
.leg-hi{stroke:#D3DBE5;stroke-width:2.5;stroke-linecap:round}
.needle{stroke:#3B4350;stroke-width:2.2;stroke-linecap:round}
.pencil{stroke:var(--accent);stroke-width:9}
.lead{fill:#3a3a3a}
.wood{fill:#E9C99A}
.hinge{fill:#4F5D70;stroke:#fff;stroke-width:2}
.stem{stroke:#4F5D70;stroke-width:6;stroke-linecap:round}
.guide{stroke:#4F5D70;stroke-width:1;stroke-dasharray:4 4}
.pin{fill:rgba(79,93,112,.18);stroke:#4F5D70;stroke-width:1.2}
.tip-h{fill:rgba(232,176,75,.22);stroke:#B9852A;stroke-width:1.5;stroke-dasharray:3 3}
.credit{margin-inline-start:auto;font:500 13px var(--ui);color:var(--muted);padding-inline:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app" dir="rtl" lang="ar">
  <div class="bar" role="toolbar" aria-label="أدوات اللوح">
    <div class="grp" aria-label="نوع الورقة">
      <span class="lbl">الورقة</span>
      <button class="btn" id="paper-graph" aria-pressed="true">بيانية</button>
      <button class="btn" id="paper-lined" aria-pressed="false">مسطّرة</button>
      <button class="btn" id="paper-blank" aria-pressed="false">بيضاء</button>
      <button class="btn" id="axes" aria-pressed="false" title="إظهار محوري س و ص">
        <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M18 9l3 3-3 3"/></svg>محاور</button>
      <button class="btn" id="paper-file" aria-pressed="false" title="فتح صورة أو ملف PDF كخلفية">
        <svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z M14 3v4h4 M12 17v-6 M9 13.5l3-3 3 3"/></svg>صورة / PDF</button>
      <input type="file" id="file-in" accept="image/*,application/pdf,.pdf" hidden>
    </div>
    <div class="grp" id="pager" aria-label="صفحات الملف" hidden>
      <button class="btn" id="pg-prev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>السابقة</button>
      <span class="lbl" id="pg-lbl"></span>
      <button class="btn" id="pg-next">التالية<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <div class="grp" aria-label="الكتابة">
      <button class="btn" id="mode-pen" aria-pressed="true" title="قلم"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z M14 7l3 3"/></svg>قلم</button>
      <button class="btn" id="mode-eraser" aria-pressed="false" title="ممحاة"><svg viewBox="0 0 24 24"><path d="M9 20h11M4 15l8.5-8.5a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L11.5 20H9z M8 11l5 5"/></svg>ممحاة</button>
      <button class="btn sw" data-color="#1B2A4A" style="background:#1B2A4A" aria-label="كحلي" aria-pressed="true"></button>
      <button class="btn sw" data-color="#C8312B" style="background:#C8312B" aria-label="أحمر" aria-pressed="false"></button>
      <button class="btn sw" data-color="#1F6FD1" style="background:#1F6FD1" aria-label="أزرق" aria-pressed="false"></button>
      <button class="btn sw" data-color="#1E8A4C" style="background:#1E8A4C" aria-label="أخضر" aria-pressed="false"></button>
      <button class="btn" data-w="2" aria-label="خط رفيع" aria-pressed="false"><span class="dot" style="width:4px;height:4px"></span></button>
      <button class="btn" data-w="3.5" aria-label="خط متوسط" aria-pressed="true"><span class="dot" style="width:7px;height:7px"></span></button>
      <button class="btn" data-w="6" aria-label="خط عريض" aria-pressed="false"><span class="dot" style="width:11px;height:11px"></span></button>
    </div>
    <div class="grp" aria-label="الأدوات الهندسية">
      <button class="btn" id="t-ruler" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 15L15 3l6 6L9 21z M7 11l2 2M10 8l2 2M13 5l2 2"/></svg>مسطرة</button>
      <button class="btn" id="t-prot" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 17a9 9 0 0 1 18 0z M12 17l5-6"/></svg>منقلة</button>
      <button class="btn" id="t-compass" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><path d="M12 3V1.5M11.3 6.5 6 21M12.7 6.5 18 21M8.5 14h7"/></svg>فرجار</button>
      <button class="btn" id="t-sq" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 20V5l15 15z M7.5 16.5V12l4.5 4.5z"/></svg>مثلث</button>
    </div>
    <div class="grp" aria-label="إجراءات">
      <button class="btn" id="finger" aria-pressed="false" title="السماح بالرسم بالإصبع"><svg viewBox="0 0 24 24"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 10V4a1.5 1.5 0 0 1 3 0v6M14 10V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-2-4a1.5 1.5 0 0 1 2.5-1.5L8 13"/></svg>رسم بالإصبع</button>
      <button class="btn" id="undo" title="تراجع"><svg viewBox="0 0 24 24"><path d="M4 4v5h5M4.6 9A8 8 0 1 1 6 16.5"/></svg>تراجع</button>
      <button class="btn" id="clear" title="مسح اللوح"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span>مسح الكل</span></button>
    </div>
    <span class="credit">أ. خولة السالمية</span>
  </div>
  <div class="board" id="board">
    <canvas id="bg"></canvas>
    <canvas id="ink"></canvas>
    <canvas id="live"></canvas>
    <div class="hud" id="hud" aria-live="polite">ارسمي بالقلم · حرّكي الأداة بإصبع وأديريها بإصبعين أو من المقبض <b>↻</b></div>
    <div class="eraser-ring" id="ering" hidden></div>
  </div>
</div>

<script>
(function(){
const CM = 40;                 // 1 cm on screen = one graph square
const SNAP = 20;               // px distance at which the pen locks onto an instrument edge
const $ = s => document.querySelector(s);
const AR = '٠١٢٣٤٥٦٧٨٩';
const ar = (n, d) => (d ? n.toFixed(d) : String(Math.round(n))).replace(/\d/g, c => AR[c]).replace('.', '٫').replace('-', '−');
const D2R = Math.PI/180;

const board = $('#board'), bg = $('#bg'), ink = $('#ink'), live = $('#live'), hud = $('#hud'), ering = $('#ering');
const bctx = bg.getContext('2d'), ictx = ink.getContext('2d'), lctx = live.getContext('2d');
let W = 0, H = 0, rect = board.getBoundingClientRect();
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const UI = "'IBM Plex Sans Arabic', 'Geeza Pro', Tahoma, sans-serif";

const st = { paper:'graph', axes:false, mode:'pen', color:'#1B2A4A', width:3.5, finger:false };
let strokes = [], history = [];

function bp(e){ return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }

/* ---------- canvas & paper ---------- */
function resize(){
  rect = board.getBoundingClientRect();
  W = rect.width; H = rect.height;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  for (const c of [bg, ink, live]){
    c.width = Math.round(W*dpr); c.height = Math.round(H*dpr);
    c.style.width = W + 'px'; c.style.height = H + 'px';
    c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  }
  drawBg(); redraw(); lctx.clearRect(0,0,W,H);
  for (const t of tools) if (!t.el.hidden) keepInside(t);
  if (st.paper === 'file' && doc) showPage();
}

/* ---------- imported picture or PDF as the page ---------- */
let doc = null, stash = null, renderTok = 0;
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function getPdfjs(){
  if (!window.pdfjsLib) await loadScript(PDFJS + 'pdf.min.js');
  if (!window.pdfjsWorker) await loadScript(PDFJS + 'pdf.worker.min.js');   // runs the reader on the page itself
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  return window.pdfjsLib;
}
function refitStrokes(or, nr){
  const k = nr.w/or.w, seen = new Set([...strokes, ...history.flat()]);
  for (const s of seen){ s.pts = s.pts.map(p => [nr.x + (p[0]-or.x)*k, nr.y + (p[1]-or.y)*k]); s.w *= k; }
}
async function showPage(){
  if (!doc) return;
  const tok = ++renderTok;
  let w, h, src;
  if (doc.kind === 'image'){ w = doc.img.naturalWidth; h = doc.img.naturalHeight; src = doc.img; }
  else {
    const page = await doc.pdf.getPage(doc.page); if (tok !== renderTok) return;
    const v1 = page.getViewport({ scale:1 }); w = v1.width; h = v1.height;
    const r = fitRect(w, h), dpr = Math.min(window.devicePixelRatio || 1, 3);
    const vp = page.getViewport({ scale: r.w/w*dpr });
    const cv = document.createElement('canvas'); cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    if (tok !== renderTok) return;
    src = cv;
  }
  doc.w = w; doc.h = h; doc.src = src;
  const nr = fitRect(w, h);
  if (doc.rect && (Math.abs(nr.w - doc.rect.w) > .5 || Math.abs(nr.x - doc.rect.x) > .5 || Math.abs(nr.y - doc.rect.y) > .5)) refitStrokes(doc.rect, nr);
  doc.rect = nr;
  drawBg(); redraw(); updatePager();
}
function updatePager(){
  const pg = $('#pager'); pg.hidden = !(st.paper === 'file' && doc && doc.n > 1);
  if (pg.hidden) return;
  $('#pg-lbl').textContent = `صفحة ${ar(doc.page)} من ${ar(doc.n)}`;
  $('#pg-prev').disabled = doc.page <= 1; $('#pg-next').disabled = doc.page >= doc.n;
}
function goPage(n){
  if (!doc || n < 1 || n > doc.n || n === doc.page) return;
  doc.pages[doc.page] = { strokes, history, rect: doc.rect };
  doc.page = n;
  const ps = doc.pages[n] || { strokes:[], history:[], rect:null };
  strokes = ps.strokes; history = ps.history; doc.rect = ps.rect;
  renderLive(null); redraw(); showPage();
}
function origin(){ return { x: Math.round(W/2/CM)*CM, y: Math.round(H/2/CM)*CM }; }
function gridLines(c, step, o, color, lw){
  c.strokeStyle = color; c.lineWidth = lw; c.beginPath();
  for (let x = ((o.x % step) + step) % step; x <= W; x += step){ const X = Math.round(x)+.5; c.moveTo(X,0); c.lineTo(X,H); }
  for (let y = ((o.y % step) + step) % step; y <= H; y += step){ const Y = Math.round(y)+.5; c.moveTo(0,Y); c.lineTo(W,Y); }
  c.stroke();
}
function fitRect(w, h){
  const m = 14, s = Math.min((W - 2*m)/w, (H - 2*m)/h), dw = w*s, dh = h*s;
  return { x:(W - dw)/2, y:(H - dh)/2, w:dw, h:dh };
}
function drawBg(){
  const c = bctx; c.clearRect(0,0,W,H); c.fillStyle = css('--paper'); c.fillRect(0,0,W,H);
  if (st.paper === 'file'){
    c.fillStyle = '#E4E9F0'; c.fillRect(0,0,W,H);
    if (doc && doc.src){
      const r = fitRect(doc.w, doc.h);
      c.save(); c.shadowColor = 'rgba(20,35,60,.28)'; c.shadowBlur = 16; c.shadowOffsetY = 3;
      c.fillStyle = '#FFFFFF'; c.fillRect(r.x, r.y, r.w, r.h); c.restore();
      c.drawImage(doc.src, r.x, r.y, r.w, r.h);
    }
  } else if (st.paper === 'graph'){
    const o = origin();
    gridLines(c, CM/5, o, css('--grid-minor'), 1);
    gridLines(c, CM, o, css('--grid-major'), 1);
    if (st.axes) drawAxes(c, o);
  } else if (st.paper === 'lined'){
    c.strokeStyle = css('--rule'); c.lineWidth = 1; c.beginPath();
    for (let y = CM*1.5; y < H; y += CM){ c.moveTo(0, Math.round(y)+.5); c.lineTo(W, Math.round(y)+.5); }
    c.stroke();
    const mx = Math.round(W - CM*1.6)+.5;
    c.strokeStyle = css('--margin'); c.beginPath(); c.moveTo(mx,0); c.lineTo(mx,H); c.stroke();
  }
}
function arrowHead(c, x, y, a){
  c.save(); c.translate(x,y); c.rotate(a); c.beginPath(); c.moveTo(0,0); c.lineTo(-11,-5); c.lineTo(-11,5); c.closePath(); c.fill(); c.restore();
}
function drawAxes(c, o){
  const col = css('--axis');
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 2;
  c.beginPath(); c.moveTo(0, o.y+.5); c.lineTo(W-4, o.y+.5); c.moveTo(o.x+.5, H); c.lineTo(o.x+.5, 4); c.stroke();
  arrowHead(c, W-2, o.y+.5, 0); arrowHead(c, o.x+.5, 2, -Math.PI/2);
  c.direction = 'ltr'; c.font = '500 12px ' + UI; c.lineWidth = 1.5;
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (let x = ((o.x % CM)+CM)%CM; x < W - 16; x += CM){
    const v = Math.round((x - o.x)/CM); if (!v) continue;
    c.beginPath(); c.moveTo(x+.5, o.y-4); c.lineTo(x+.5, o.y+5); c.stroke();
    c.fillText(ar(v), x, o.y + 7);
  }
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let y = ((o.y % CM)+CM)%CM; y < H; y += CM){
    const v = -Math.round((y - o.y)/CM); if (!v || y < 16) continue;
    c.beginPath(); c.moveTo(o.x-4, y+.5); c.lineTo(o.x+5, y+.5); c.stroke();
    c.fillText(ar(v), o.x - 7, y);
  }
  c.textAlign = 'right'; c.textBaseline = 'top'; c.fillText(ar(0), o.x - 6, o.y + 6);
  c.font = '700 15px ' + UI; c.textAlign = 'center';
  c.fillText('س', W - 14, o.y - 26); c.fillText('ص', o.x + 18, 6);
}

/* ---------- strokes ---------- */
function drawStroke(c, s){
  const p = s.pts; if (!p.length) return;
  c.strokeStyle = s.color; c.lineWidth = s.w; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(p[0][0], p[0][1]);
  if (p.length === 1) c.lineTo(p[0][0] + .01, p[0][1]);
  else if (s.smooth){
    for (let i = 1; i < p.length - 1; i++){ c.quadraticCurveTo(p[i][0], p[i][1], (p[i][0]+p[i+1][0])/2, (p[i][1]+p[i+1][1])/2); }
    c.lineTo(p[p.length-1][0], p[p.length-1][1]);
  } else for (let i = 1; i < p.length; i++) c.lineTo(p[i][0], p[i][1]);
  c.stroke();
}
function redraw(){ ictx.clearRect(0,0,W,H); for (const s of strokes) drawStroke(ictx, s); }
function renderLive(s){ lctx.clearRect(0,0,W,H); if (s) drawStroke(lctx, s); }
function pushHistory(){ history.push(strokes.slice()); if (history.length > 80) history.shift(); }
function commit(s){ pushHistory(); strokes.push(s); drawStroke(ictx, s); renderLive(null); save(); }
function pushPt(s, x, y){
  const l = s.pts[s.pts.length-1];
  if (l && Math.abs(l[0]-x) < .4 && Math.abs(l[1]-y) < .4) return;
  s.pts.push([Math.round(x*10)/10, Math.round(y*10)/10]);
}

/* ---------- edge snapping ---------- */
function worldEdges(t){
  const a = t.rot*D2R, cs = Math.cos(a), sn = Math.sin(a);
  return t.edges().map(e => ({
    a: toBoard(t, e.a[0], e.a[1]), b: toBoard(t, e.b[0], e.b[1]),
    n: [cs*e.n[0] - sn*e.n[1], sn*e.n[0] + cs*e.n[1]], free: !!e.free
  }));
}
function segT(E, p){ const dx = E.b[0]-E.a[0], dy = E.b[1]-E.a[1]; return ((p.x-E.a[0])*dx + (p.y-E.a[1])*dy)/(dx*dx+dy*dy); }
function onLine(E, t){ return [E.a[0] + t*(E.b[0]-E.a[0]), E.a[1] + t*(E.b[1]-E.a[1])]; }
function segDist(E, p){
  const t = segT(E, p); if (t < -.01 || t > 1.01) return 1e9;
  const q = onLine(E, Math.max(0, Math.min(1, t))); return Math.hypot(p.x-q[0], p.y-q[1]);
}
function lineDist(E, p){ const q = onLine(E, segT(E, p)); return Math.hypot(p.x-q[0], p.y-q[1]); }
function project(E, p, w){
  let t = segT(E, p); if (!E.free) t = Math.max(0, Math.min(1, t));
  const q = onLine(E, t), off = (E.n[0] || E.n[1]) ? w/2 + .6 : 0;
  return [q[0] + E.n[0]*off, q[1] + E.n[1]*off];
}
function edgesNear(p){
  const out = [];
  for (const t of tools){ if (t.el.hidden) continue; for (const E of worldEdges(t)) if (segDist(E, p) < SNAP) out.push(E); }
  return out;
}

/* ---------- drawing & erasing on the board ---------- */
let cur = null, erasing = null;
function canDraw(e){
  if (e.pointerType === 'pen') return true;
  if (e.pointerType === 'mouse') return e.button === 0;
  return st.finger && !cur && !erasing;
}
function addPoint(p){
  const s = cur.s;
  if (!cur.snap && cur.cands.length > 1){
    cur.raw.push(p);
    if (Math.hypot(p.x-cur.start.x, p.y-cur.start.y) > 10){
      cur.snap = cur.cands.reduce((b, E) => lineDist(E, p) < lineDist(b, p) ? E : b);
      s.smooth = false; s.pts = [];
      for (const q of cur.raw){ const r = project(cur.snap, q, s.w); pushPt(s, r[0], r[1]); }
    } else pushPt(s, p.x, p.y);
    return;
  }
  if (cur.snap){ const r = project(cur.snap, p, s.w); pushPt(s, r[0], r[1]); }
  else pushPt(s, p.x, p.y);
}
function strokeHit(s, p, r){
  const R = r + s.w/2, P = s.pts;
  if (P.length === 1) return Math.hypot(P[0][0]-p.x, P[0][1]-p.y) < R;
  for (let i = 1; i < P.length; i++){
    const ax = P[i-1][0], ay = P[i-1][1], dx = P[i][0]-ax, dy = P[i][1]-ay, L = dx*dx+dy*dy;
    let t = L ? ((p.x-ax)*dx + (p.y-ay)*dy)/L : 0; t = Math.max(0, Math.min(1, t));
    if (Math.hypot(p.x-(ax+t*dx), p.y-(ay+t*dy)) < R) return true;
  }
  return false;
}
function eraseAt(p){
  let hit = false;
  for (let i = strokes.length-1; i >= 0; i--) if (strokeHit(strokes[i], p, 13)){
    if (!erasing.removed){ pushHistory(); erasing.removed = true; }
    strokes.splice(i, 1); hit = true;
  }
  if (hit) redraw();
}
function showRing(p){ ering.hidden = false; ering.style.left = p.x + 'px'; ering.style.top = p.y + 'px'; }
const coalesced = e => { const l = e.getCoalescedEvents ? e.getCoalescedEvents() : []; return l.length ? l : [e]; };

board.addEventListener('touchstart', e => { if (e.target.closest('.board')) e.preventDefault(); }, { passive:false });
board.addEventListener('pointerdown', e => {
  if (!canDraw(e)) return;
  e.preventDefault();
  rect = board.getBoundingClientRect();
  try { board.setPointerCapture(e.pointerId); } catch(_){}
  const p = bp(e);
  if (st.mode === 'eraser'){ erasing = { id:e.pointerId, removed:false }; eraseAt(p); showRing(p); return; }
  const cands = edgesNear(p);
  cur = { id:e.pointerId, s:{ color:st.color, w:st.width, pts:[], smooth: cands.length === 0 }, cands, snap: cands.length === 1 ? cands[0] : null, raw:[], start:p };
  addPoint(p); renderLive(cur.s);
});
board.addEventListener('pointermove', e => {
  if (erasing && e.pointerId === erasing.id){ for (const ev of coalesced(e)) eraseAt(bp(ev)); showRing(bp(e)); return; }
  if (!cur || e.pointerId !== cur.id) return;
  for (const ev of coalesced(e)) addPoint(bp(ev));
  renderLive(cur.s);
});
function endDraw(e){
  if (erasing && e.pointerId === erasing.id){ erasing = null; ering.hidden = true; save(); return; }
  if (!cur || e.pointerId !== cur.id) return;
  const s = cur.s; cur = null; commit(s);
}
board.addEventListener('pointerup', endDraw);
board.addEventListener('pointercancel', endDraw);

/* ---------- instruments ---------- */
const tools = [];
let zTop = 10;
function apply(t){ t.el.style.transform = `translate(${t.x}px,${t.y}px) rotate(${t.rot}deg)`; }
function toBoard(t, lx, ly){ const a = t.rot*D2R, c = Math.cos(a), s = Math.sin(a); return [t.x + c*lx - s*ly, t.y + s*lx + c*ly]; }
function toLocal(t, bx, by){ const a = -t.rot*D2R, c = Math.cos(a), s = Math.sin(a), dx = bx-t.x, dy = by-t.y; return [c*dx - s*dy, s*dx + c*dy]; }
function svgWrap(x, y, w, h, inner){ return `<svg viewBox="${x} ${y} ${w} ${h}" width="${w}" height="${h}" style="left:${x}px;top:${y}px">${inner}</svg>`; }
function knob(cx, cy, h){
  return `<g data-h="${h}"><circle cx="${cx}" cy="${cy}" r="24" class="hit"/><circle cx="${cx}" cy="${cy}" r="15" class="knob-c"/>` +
    `<path class="knob-i" transform="translate(${cx-8} ${cy-8}) scale(.667)" d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/></g>`;
}
function angleOf(t){ return ((-Math.round(t.rot)) % 360 + 360) % 360; }
function snapRot(r){ const m = Math.round(r/15)*15; return Math.abs(r - m) < 1.5 ? m : Math.round(r); }
function bringFront(t){ t.el.style.zIndex = ++zTop; }
function keepInside(t){
  t.x = Math.min(Math.max(t.x, -CM*2), W - CM); t.y = Math.min(Math.max(t.y, CM), H + CM*1.5); apply(t);
}

function makeTool(o){
  const t = Object.assign({ x:0, y:0, rot:0, pointers:new Map(), hDrag:null, placed:false }, o);
  t.el = document.createElement('div'); t.el.className = 'tool'; t.el.hidden = true;
  board.insertBefore(t.el, hud);
  t.render(); apply(t); bindGestures(t); tools.push(t);
  return t;
}
function rotateAbout(t, c, d){
  const cs = Math.cos(d), sn = Math.sin(d), dx = t.x - c.x, dy = t.y - c.y;
  t.x = c.x + cs*dx - sn*dy; t.y = c.y + sn*dx + cs*dy; t.rot += d/D2R;
}
function bindGestures(t){
  const el = t.el;
  el.addEventListener('pointerdown', e => {
    const hEl = e.target.closest('[data-h]'), handle = hEl ? hEl.dataset.h : 'body';
    if (handle === 'body' && e.pointerType === 'pen') return;               // the pencil writes along the instrument
    if (handle === 'body' && e.pointerType === 'mouse' && st.mode === 'eraser') return;
    e.stopPropagation(); e.preventDefault();
    rect = board.getBoundingClientRect();
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    bringFront(t);
    const p = bp(e);
    t.pointers.set(e.pointerId, { p, handle });
    if (handle !== 'body' && !t.hDrag){ t.hDrag = { id:e.pointerId, handle }; t.startHandle(handle, p); }
    showHud(t);
  });
  el.addEventListener('pointermove', e => {
    const rec = t.pointers.get(e.pointerId); if (!rec) return;
    const p = bp(e);
    if (t.hDrag && t.hDrag.id === e.pointerId){ t.moveHandle(t.hDrag.handle, p); rec.p = p; showHud(t); return; }
    const body = [...t.pointers.entries()].filter(([id, r]) => r.handle === 'body');
    if (body.length === 1){ t.x += p.x - rec.p.x; t.y += p.y - rec.p.y; rec.p = p; }
    else if (body.length >= 2){
      const [A, B] = body;
      if (A[0] !== e.pointerId && B[0] !== e.pointerId){ rec.p = p; return; }
      const oA = A[1].p, oB = B[1].p, nA = A[0] === e.pointerId ? p : oA, nB = B[0] === e.pointerId ? p : oB;
      const oc = { x:(oA.x+oB.x)/2, y:(oA.y+oB.y)/2 }, nc = { x:(nA.x+nB.x)/2, y:(nA.y+nB.y)/2 };
      const d = Math.atan2(nB.y-nA.y, nB.x-nA.x) - Math.atan2(oB.y-oA.y, oB.x-oA.x);
      rotateAbout(t, oc, d); t.x += nc.x - oc.x; t.y += nc.y - oc.y;
      rec.p = p; t.twoFinger = true;
    }
    apply(t); showHud(t);
  });
  const up = e => {
    if (!t.pointers.has(e.pointerId)) return;
    t.pointers.delete(e.pointerId);
    if (t.hDrag && t.hDrag.id === e.pointerId){ t.endHandle && t.endHandle(t.hDrag.handle); t.hDrag = null; }
    if (!t.pointers.size && t.twoFinger){
      t.twoFinger = false;
      const target = snapRot(t.rot);
      const c = { x:t.x, y:t.y }; rotateAbout(t, c, (target - t.rot)*D2R); t.rot = target; apply(t);
    }
    showHud(t); save();
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}
/* rotation knob around the instrument's pivot (shared) */
function rotStart(t, p){ t.r0 = t.rot; t.a0 = Math.atan2(p.y - t.y, p.x - t.x); }
function rotMove(t, p){ const a = Math.atan2(p.y - t.y, p.x - t.x); t.rot = snapRot(t.r0 + (a - t.a0)/D2R); apply(t); }

/* Ruler: 15 cm, millimetre marks, pivot at the 0 mark */
const ruler = makeTool({
  name:'ruler', btn:'#t-ruler',
  render(){
    const L = 15*CM, P = .5*CM, Hh = 2.3*CM;
    let s = `<rect x="${-P}" y="0" width="${L+2*P}" height="${Hh}" rx="7" class="ruler-b"/>`;
    for (let i = 0; i <= 150; i++){
      const x = i*CM/10, len = i%10 === 0 ? .62*CM : i%5 === 0 ? .44*CM : .26*CM;
      s += `<line x1="${x}" y1="0" x2="${x}" y2="${len}" class="tk${i%10 === 0 ? ' tk-b' : ''}"/>`;
      if (i%10 === 0) s += `<text x="${x}" y="${1.22*CM}" class="num">${ar(i/10)}</text>`;
    }
    s += `<line x1="${-P}" y1="${Hh}" x2="${L+P}" y2="${Hh}" class="tk" opacity=".4"/>`;
    s += `<text x="${.2*CM}" y="${1.95*CM}" class="unit">سم</text>`;
    s += knob(L - .6*CM, 1.6*CM, 'rot');
    this.el.innerHTML = svgWrap(-P-4, -4, L+2*P+8, Hh+8, s);
  },
  edges(){ const L = 15*CM, P = .5*CM, Hh = 2.3*CM;
    return [ { a:[-P,0], b:[L+P,0], n:[0,-1] }, { a:[-P,Hh], b:[L+P,Hh], n:[0,1] } ]; },
  startHandle(h, p){ rotStart(this, p); }, moveHandle(h, p){ rotMove(this, p); },
  hud(){ return `المسطرة · زاوية الميل <b>${ar(angleOf(this))}°</b>`; },
  place(){ this.x = W/2 - 7.5*CM; this.y = H*.66; this.rot = 0; }
});

/* Protractor: 180° with outer and inner scales, centre at the pivot, a red arm to read or draw an angle */
const RP = 6.2*CM, STRIP = .9*CM;
const prot = makeTool({
  name:'prot', btn:'#t-prot', arm:60,
  render(){
    let s = `<path d="M ${-RP} ${STRIP} L ${-RP} 0 A ${RP} ${RP} 0 0 1 ${RP} 0 L ${RP} ${STRIP} Z" class="prot-b"/>`;
    s += `<path d="M ${-(RP-1.9*CM)} 0 A ${RP-1.9*CM} ${RP-1.9*CM} 0 0 1 ${RP-1.9*CM} 0" fill="none" class="tk-p" opacity=".6"/>`;
    for (let a = 0; a <= 180; a++){
      const c = Math.cos(a*D2R), sn = -Math.sin(a*D2R), len = a%10 === 0 ? .7*CM : a%5 === 0 ? .48*CM : .28*CM;
      s += `<line x1="${RP*c}" y1="${RP*sn}" x2="${(RP-len)*c}" y2="${(RP-len)*sn}" class="tk-p${a%10 === 0 ? ' tk-pb' : ''}"/>`;
      if (a%10 === 0){
        const r1 = RP - 1.05*CM, r2 = RP - 1.5*CM;
        s += `<text x="${r1*c}" y="${r1*sn}" class="num-p">${ar(180 - a)}</text>`;
        s += `<text x="${r2*c}" y="${r2*sn}" class="num-in">${ar(a)}</text>`;
      }
    }
    s += `<line x1="${-RP}" y1="0" x2="${RP}" y2="0" class="base"/>`;
    s += `<line x1="0" y1="-9" x2="0" y2="9" class="base"/><circle cx="0" cy="0" r="3" fill="#163a63"/>`;
    const Lr = RP + 1.3*CM;
    s += `<g id="prot-arm"><line id="arm-l" class="arm" x1="0" y1="0" x2="0" y2="0"/>` +
         `<g data-h="arm"><circle id="arm-hit" r="24" class="hit"/><circle id="arm-k" r="13" class="arm-k"/></g>` +
         `<text id="arm-t" class="arm-t"></text></g>`;
    s += knob(RP - .7*CM, STRIP/2, 'rot');
    this.el.innerHTML = svgWrap(-Lr-60, -Lr-60, 2*Lr+120, Lr+60+STRIP+6, s);
    this.Lr = Lr; this.updateArm();
  },
  updateArm(){
    const a = this.arm*D2R, c = Math.cos(a), sn = -Math.sin(a), L = this.Lr, el = this.el;
    const l = el.querySelector('#arm-l'); l.setAttribute('x2', L*c); l.setAttribute('y2', L*sn);
    for (const id of ['#arm-hit','#arm-k']){ const k = el.querySelector(id); k.setAttribute('cx', L*c); k.setAttribute('cy', L*sn); }
    const t = el.querySelector('#arm-t'); t.setAttribute('x', (L+.95*CM)*c); t.setAttribute('y', (L+.95*CM)*sn); t.textContent = ar(this.arm) + '°';
  },
  edges(){
    const a = this.arm*D2R, L = this.Lr;
    return [ { a:[-RP,0], b:[RP,0], n:[0,0], free:true }, { a:[0,0], b:[L*Math.cos(a), -L*Math.sin(a)], n:[0,0], free:true } ];
  },
  startHandle(h, p){ if (h === 'rot') rotStart(this, p); },
  moveHandle(h, p){
    if (h === 'rot') return rotMove(this, p);
    const q = toLocal(this, p.x, p.y); let a = Math.atan2(-q[1], q[0])/D2R;
    if (a < 0) a = a < -90 ? 180 : 0;
    this.arm = Math.max(0, Math.min(180, Math.round(a))); this.updateArm();
  },
  hud(){ return `المنقلة · الذراع الأحمر <b>${ar(this.arm)}°</b> · الدوران ${ar(angleOf(this))}°`; },
  place(){ this.x = W/2; this.y = Math.max(RP + CM*1.5, H*.48); this.rot = 0; }
});

/* Set square 30°-60°-90°: right angle at the pivot */
const L1 = 12*CM, L2 = L1*Math.tan(30*D2R);
const sq = makeTool({
  name:'sq', btn:'#t-sq',
  render(){
    const A = [0,0], B = [L1,0], C = [0,-L2];
    const a = Math.hypot(L1, L2), b = L2, c = L1, per = a+b+c;
    const I = [(a*A[0]+b*B[0]+c*C[0])/per, (a*A[1]+b*B[1]+c*C[1])/per];
    const rin = (L1*L2/2)/(per/2), k = (rin - 1.45*CM)/rin;
    const inn = [A,B,C].map(P => [I[0] + k*(P[0]-I[0]), I[1] + k*(P[1]-I[1])]);
    let s = `<path class="sq-b" d="M${A} L${B} L${C} Z M${inn[0]} L${inn[2]} L${inn[1]} Z"/>`;
    for (let i = 0; i <= 115; i++){
      const x = i*CM/10, len = i%10 === 0 ? .55*CM : i%5 === 0 ? .4*CM : .24*CM;
      s += `<line x1="${x}" y1="0" x2="${x}" y2="${-len}" class="tk${i%10 === 0 ? ' tk-b' : ''}"/>`;
      if (i%10 === 0 && i) s += `<text x="${x}" y="${-.72*CM}" class="num" style="font-size:11px">${ar(i/10)}</text>`;
    }
    for (let i = 0; i <= 66; i++){
      const y = -i*CM/10, len = i%10 === 0 ? .55*CM : i%5 === 0 ? .4*CM : .24*CM;
      s += `<line x1="0" y1="${y}" x2="${len}" y2="${y}" class="tk${i%10 === 0 ? ' tk-b' : ''}"/>`;
      if (i%10 === 0 && i) s += `<text x="${.82*CM}" y="${y+4}" class="num" style="font-size:11px">${ar(i/10)}</text>`;
    }
    const lab = (P, Q, R, d, txt) => { const u = [Q[0]-P[0], Q[1]-P[1]], v = [R[0]-P[0], R[1]-P[1]], lu = Math.hypot(...u), lv = Math.hypot(...v);
      const m = [u[0]/lu + v[0]/lv, u[1]/lu + v[1]/lv], lm = Math.hypot(...m);
      return `<text x="${P[0] + m[0]/lm*d}" y="${P[1] + m[1]/lm*d}" class="ang">${txt}</text>`; };
    s += lab(B, A, C, 3.6*CM, ar(30)+'°') + lab(C, A, B, 2.2*CM, ar(60)+'°') + lab(A, B, C, 1.9*CM, ar(90)+'°');
    s += knob(I[0], I[1], 'rot');
    this.el.innerHTML = svgWrap(-8, -L2-8, L1+16, L2+16, s);
  },
  edges(){ const h = Math.hypot(L1, L2);
    return [ { a:[0,0], b:[L1,0], n:[0,1] }, { a:[0,0], b:[0,-L2], n:[-1,0] }, { a:[L1,0], b:[0,-L2], n:[L2/h, -L1/h] } ]; },
  startHandle(h, p){ rotStart(this, p); }, moveHandle(h, p){ rotMove(this, p); },
  hud(){ return `المثلث · زاوية الميل <b>${ar(angleOf(this))}°</b>`; },
  place(){ this.x = W/2 - 6*CM; this.y = H*.78; this.rot = 0; }
});

/* Compass: needle at the pivot, pencil at radius r; turning the top knob draws the arc */
const LEG = 8*CM;
const compass = makeTool({
  name:'compass', btn:'#t-compass', r:4*CM,
  geo(){ const half = this.r/2, hh = Math.sqrt(Math.max(LEG*LEG - half*half, 100)); return { hx:half, hy:-hh, ky:-hh - 1.2*CM }; },
  render(){
    const r = this.r, { hx, hy, ky } = this.geo();
    const pu = [r-hx, -hy], pl = Math.hypot(...pu), ux = pu[0]/pl, uy = pu[1]/pl;
    const pb = [r - ux*2.2*CM, -uy*2.2*CM], lb = [r - ux*.55*CM, -uy*.55*CM];
    const nv = [-hx, -hy], nl = Math.hypot(...nv), vx = nv[0]/nl, vy = nv[1]/nl, nb = [-vx*.8*CM, -vy*.8*CM];
    const px = -uy*4.5, py = ux*4.5;
    let s = `<line x1="0" y1="0" x2="${r}" y2="0" class="guide"/>`;
    s += `<line x1="${hx}" y1="${hy}" x2="${nb[0]}" y2="${nb[1]}" class="hitl"/><line x1="${hx}" y1="${hy}" x2="${r}" y2="0" class="hitl"/>`;
    s += `<line x1="${hx}" y1="${hy}" x2="${nb[0]}" y2="${nb[1]}" class="leg"/><line x1="${hx}" y1="${hy}" x2="${nb[0]}" y2="${nb[1]}" class="leg-hi"/>`;
    s += `<line x1="${nb[0]}" y1="${nb[1]}" x2="0" y2="0" class="needle"/>`;
    s += `<line x1="${hx}" y1="${hy}" x2="${pb[0]}" y2="${pb[1]}" class="leg"/><line x1="${hx}" y1="${hy}" x2="${pb[0]}" y2="${pb[1]}" class="leg-hi"/>`;
    s += `<line x1="${pb[0]}" y1="${pb[1]}" x2="${lb[0]}" y2="${lb[1]}" class="pencil"/>`;
    s += `<polygon class="wood" points="${lb[0]+px},${lb[1]+py} ${lb[0]-px},${lb[1]-py} ${r - ux*.18*CM},${-uy*.18*CM}"/>`;
    s += `<polygon class="lead" points="${r - ux*.18*CM + px*.4},${-uy*.18*CM + py*.4} ${r - ux*.18*CM - px*.4},${-uy*.18*CM - py*.4} ${r},0"/>`;
    s += `<line x1="${hx}" y1="${hy}" x2="${hx}" y2="${ky}" class="stem"/><circle cx="${hx}" cy="${hy}" r="9" class="hinge"/>`;
    s += `<circle cx="0" cy="0" r="14" class="pin"/>`;
    s += `<g data-h="tip"><circle cx="${r}" cy="0" r="24" class="hit"/><circle cx="${r}" cy="0" r="14" class="tip-h"/></g>`;
    s += knob(hx, ky, 'knob');
    this.el.innerHTML = svgWrap(-44, ky-44, r+88, -ky+88, s);
  },
  edges(){ return []; },
  startHandle(h, p){
    if (h === 'knob'){
      const { hx, ky } = this.geo(); this.kOff = Math.atan2(ky, hx); this.phi = this.rot*D2R;
      const tip = toBoard(this, this.r, 0);
      this.arc = { color:st.color, w:st.width, pts:[], smooth:false }; pushPt(this.arc, tip[0], tip[1]); renderLive(this.arc);
    }
  },
  moveHandle(h, p){
    if (h === 'tip'){
      const dx = p.x - this.x, dy = p.y - this.y;
      this.r = Math.max(.3*CM, Math.min(14*CM, Math.round(Math.hypot(dx, dy)/(CM/10))*(CM/10)));
      this.rot = Math.atan2(dy, dx)/D2R; this.render(); apply(this); return;
    }
    const target = Math.atan2(p.y - this.y, p.x - this.x) - this.kOff;
    let d = target - this.phi; d = Math.atan2(Math.sin(d), Math.cos(d));
    const n = Math.max(1, Math.ceil(Math.abs(d)/(1.2*D2R)));
    for (let i = 1; i <= n; i++){ const f = this.phi + d*i/n; pushPt(this.arc, this.x + this.r*Math.cos(f), this.y + this.r*Math.sin(f)); }
    this.phi += d; this.rot = this.phi/D2R; apply(this); renderLive(this.arc);
  },
  endHandle(h){ if (h === 'knob' && this.arc){ if (this.arc.pts.length > 1) commit(this.arc); else renderLive(null); this.arc = null; } },
  hud(){ return `الفرجار · نصف القطر <b>${ar(this.r/CM, 1)} سم</b> · أديري المقبض العلوي لرسم القوس`; },
  place(){ this.x = W/2 + 2*CM; this.y = H*.5 + 2*CM; this.rot = 0; }
});

function showHud(t){ hud.innerHTML = t.hud(); }

/* ---------- toolbar ---------- */
function press(sel, on){ const b = $(sel); if (b) b.setAttribute('aria-pressed', on ? 'true' : 'false'); }
function pressPaper(p){ for (const k of ['graph','lined','blank','file']) press('#paper-'+k, k === p); $('#axes').disabled = p !== 'graph'; updatePager(); }
function setPaper(p){
  if (st.paper === 'file' && stash){ strokes = stash.strokes; history = stash.history; stash = null; doc = null; renderTok++; renderLive(null); redraw(); }
  st.paper = p; pressPaper(p); drawBg(); save();
}
$('#paper-file').addEventListener('click', () => $('#file-in').click());
$('#file-in').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  hud.innerHTML = 'جارٍ فتح الملف…';
  try {
    let nd;
    if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){
      const lib = await getPdfjs();
      const pdf = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
      nd = { kind:'pdf', pdf, n: pdf.numPages, page:1, pages:{}, rect:null };
    } else if (f.type.startsWith('image/') || /\.(png|jpe?g|gif|webp|heic)$/i.test(f.name)){
      const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
      nd = { kind:'image', img, n:1, page:1, pages:{}, rect:null };
    } else throw new Error('type');
    if (st.paper !== 'file') stash = { strokes, history, paper: st.paper };
    doc = nd; strokes = []; history = []; st.paper = 'file';
    pressPaper('file'); renderLive(null); redraw();
    await showPage();
    hud.innerHTML = `<b>${f.name.replace(/[<>&]/g, '')}</b> · اكتبي وارسمي فوق الملف بالقلم`;
  } catch(err){
    hud.innerHTML = 'تعذّر فتح الملف. اختاري صورة (JPG أو PNG) أو ملف PDF، وتأكدي من الاتصال بالإنترنت عند فتح أول ملف PDF.';
  }
});
$('#pg-prev').addEventListener('click', () => goPage(doc ? doc.page - 1 : 0));
$('#pg-next').addEventListener('click', () => goPage(doc ? doc.page + 1 : 0));
for (const k of ['graph','lined','blank']) $('#paper-'+k).addEventListener('click', () => setPaper(k));
$('#axes').addEventListener('click', () => { st.axes = !st.axes; press('#axes', st.axes); drawBg(); save(); });
function setMode(m){ st.mode = m; press('#mode-pen', m === 'pen'); press('#mode-eraser', m === 'eraser');
  hud.innerHTML = m === 'eraser' ? 'الممحاة · مرّري القلم على الخط لمسحه' : 'القلم جاهز · يلتصق الخط بحافة الأداة عند الرسم بجانبها'; }
$('#mode-pen').addEventListener('click', () => setMode('pen'));
$('#mode-eraser').addEventListener('click', () => setMode('eraser'));
document.querySelectorAll('[data-color]').forEach(b => b.addEventListener('click', () => {
  st.color = b.dataset.color; document.querySelectorAll('[data-color]').forEach(x => press_el(x, x === b)); setMode('pen'); }));
document.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => {
  st.width = +b.dataset.w; document.querySelectorAll('[data-w]').forEach(x => press_el(x, x === b)); setMode('pen'); }));
function press_el(b, on){ b.setAttribute('aria-pressed', on ? 'true' : 'false'); }
function showTool(t, on){
  if (on && !t.placed){ t.place(); t.placed = true; }
  t.el.hidden = !on; press(t.btn, on);
  if (on){ apply(t); keepInside(t); bringFront(t); showHud(t); }
  save();
}
for (const t of tools) $(t.btn).addEventListener('click', () => showTool(t, t.el.hidden));
$('#finger').addEventListener('click', () => { st.finger = !st.finger; press('#finger', st.finger);
  hud.innerHTML = st.finger ? 'الرسم بالإصبع مفعّل · ما زال لمس الأداة يحرّكها' : 'الرسم بالقلم فقط · اللمس بالإصبع للأدوات'; save(); });
$('#undo').addEventListener('click', () => { if (!history.length) return; strokes = history.pop(); redraw(); save(); });
let clearTimer = null;
$('#clear').addEventListener('click', () => {
  const b = $('#clear'), span = b.querySelector('span');
  if (!b.classList.contains('warn')){
    b.classList.add('warn'); span.textContent = 'اضغطي للتأكيد';
    clearTimer = setTimeout(() => { b.classList.remove('warn'); span.textContent = 'مسح الكل'; }, 3000);
    return;
  }
  clearTimeout(clearTimer); b.classList.remove('warn'); span.textContent = 'مسح الكل';
  if (strokes.length){ pushHistory(); strokes = []; redraw(); save(); }
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* ---------- remember the board on this device ---------- */
const KEY = 'geo-board-v1';
let saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try {
      const base = stash || { strokes, paper: st.paper };   // drawings over an opened file stay with that file only
      localStorage.setItem(KEY, JSON.stringify({
        strokes: base.strokes, paper: base.paper, axes:st.axes, finger:st.finger,
        tools: tools.map(t => ({ n:t.name, x:t.x, y:t.y, rot:t.rot, vis:!t.el.hidden, placed:t.placed, r:t.r, arm:t.arm }))
      }));
    } catch(_){}
  }, 300);
}
function load(){
  let d = null; try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(_){}
  if (!d) return false;
  if (Array.isArray(d.strokes)) strokes = d.strokes;
  st.axes = !!d.axes; press('#axes', st.axes);
  st.finger = !!d.finger; press('#finger', st.finger);
  setPaper(['graph','lined','blank'].includes(d.paper) ? d.paper : 'graph');
  for (const s of d.tools || []){
    const t = tools.find(x => x.name === s.n); if (!t) continue;
    Object.assign(t, { x:s.x, y:s.y, rot:s.rot, placed:!!s.placed });
    if (t === compass && s.r) { t.r = s.r; t.render(); }
    if (t === prot && s.arm != null) { t.arm = s.arm; t.updateArm(); }
    apply(t); t.el.hidden = !s.vis; press(t.btn, s.vis);
  }
  return true;
}

resize();
if (!load()){ showTool(prot, true); showTool(ruler, true); hud.innerHTML = 'ارسمي بالقلم · حرّكي الأداة بإصبع وأديريها بإصبعين أو من المقبض <b>↻</b>'; }
redraw();
new ResizeObserver(resize).observe(board);
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
